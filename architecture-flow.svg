<svg fill="none" viewBox="0 0 800 170" width="800" height="170" xmlns="http://www.w3.org/2000/svg">
  <style>
    .flow-line {
      stroke-dasharray: 6, 6;
      animation: dash 20s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <rect width="800" height="170" rx="10" fill="#090D16" stroke="#1E293B" stroke-width="1.5"/>
  <text fill="#38BDF8" font-family="monospace" font-size="11" font-weight="600" x="25" y="28">SYSTEM PIPELINE ARCHITECTURE</text>

  <!-- Node 1: Client -->
  <rect x="30" y="55" width="130" height="75" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" x="72" y="88">Client</text>
  <text fill="#64748B" font-family="monospace" font-size="10" x="52" y="106">HTTP / REST</text>

  <!-- Animated Flow 1 -->
  <path d="M160 92h50" stroke="#38BDF8" stroke-width="2" class="flow-line"/>
  <polygon points="210,92 202,87 202,97" fill="#38BDF8"/>

  <!-- Node 2: Spring Boot API -->
  <rect x="210" y="55" width="170" height="75" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" x="248" y="88">Spring Boot API</text>
  <text fill="#64748B" font-family="monospace" font-size="10" x="238" y="106">Auth / Rate Limit</text>

  <!-- Animated Flow 2 -->
  <path d="M380 92h50" stroke="#38BDF8" stroke-width="2" class="flow-line"/>
  <polygon points="430,92 422,87 422,97" fill="#38BDF8"/>

  <!-- Node 3: Kafka / Async -->
  <rect x="430" y="55" width="150" height="75" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" x="468" y="88">Apache Kafka</text>
  <text fill="#64748B" font-family="monospace" font-size="10" x="460" y="106">Event Queue</text>

  <!-- Animated Flow 3 -->
  <path d="M580 92h50" stroke="#38BDF8" stroke-width="2" class="flow-line"/>
  <polygon points="630,92 622,87 622,97" fill="#38BDF8"/>

  <!-- Node 4: Persistence -->
  <rect x="630" y="55" width="140" height="75" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" x="655" y="88">PostgreSQL</text>
  <text fill="#64748B" font-family="monospace" font-size="10" x="662" y="106">Data Layer</text>
</svg>
